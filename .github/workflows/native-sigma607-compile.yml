name: Native Sigma 6.0.7 compile and script smoke (NOT SYPC node)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sypc-sigma607-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native6-compiler:
    name: Exact sigma-state 6.0.7 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout review candidate (no saved credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install exact Java 11
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '11'
      - name: Pinned sbt launcher
        uses: sbt/setup-sbt@6c68d2fe8dfbc0a0534d70101baa2e0420e1a506 # v1.1.9
        with:
          sbt-runner-version: '1.11.1'
      - name: Compile SIX source contracts against sigma-state 6.0.7
        shell: bash
        run: |
          set -euo pipefail
          cd research/native6
          sbt -batch 'runMain org.sypcoin.swap.NativeSigma607Compile ../ergo_script' \
            2>&1 | tee "$RUNNER_TEMP/native6-compiler.log"
          test "$(grep -c 'SYPC_NATIVE6_COMPILE_PASS Atomic' "$RUNNER_TEMP/native6-compiler.log")" -eq 6
          grep -q 'SYPC_NATIVE6_COMPILER_ONLY_SIX_CONTRACTS_PASS' "$RUNNER_TEMP/native6-compiler.log"
          grep -q 'NOT_SYPC_CONSENSUS_NOT_FULL_TRANSACTION_NOT_SIGNATURE_VERIFICATION' "$RUNNER_TEMP/native6-compiler.log"
          # Independent offline reviewer pins ALL six compile-output hashes
          # and byte lengths; a "success" message alone is not evidence.
          python3 ../../tools/review_native6_compilation.py \
            --manifest fingerprints.json \
            --log "$RUNNER_TEMP/native6-compiler.log" \
            | tee "$RUNNER_TEMP/native6-review.json"
          grep -q '"status": "PASS_PINNED_SIGMA607_COMPILER_ONLY"' "$RUNNER_TEMP/native6-review.json"
          echo "NATIVE_SIGMA607_COMPILER_GATE_PASS; NO_NATIVE_SYPC_TX_EXECUTION"
      - name: Execute synthetic SELL with real Sigma 6.0.7 interpreter
        shell: bash
        run: |
          set -euo pipefail
          cd research/native6
          sbt -batch 'runMain org.sypcoin.swap.NativeSigma607InterpreterSmoke ../ergo_script/AtomicSellSponsorRefund.sc ../ergo_script/AtomicBuySponsorRefund.sc' \
            2>&1 | tee "$RUNNER_TEMP/sigma607-interpreter.log"
          test "$(grep -c 'SIGMA607_INTERPRETER_REJECT:' "$RUNNER_TEMP/sigma607-interpreter.log")" -eq 10
          grep -q 'SIGMA607_INTERPRETER_PASS:valid' "$RUNNER_TEMP/sigma607-interpreter.log"
          grep -q 'SIGMA607_INTERPRETER_SELL_SYNTHETIC_11_CASES_PASS' "$RUNNER_TEMP/sigma607-interpreter.log"
          test "$(grep -c 'SIGMA607_BUY_REJECT:' "$RUNNER_TEMP/sigma607-interpreter.log")" -eq 7
          grep -q 'SIGMA607_BUY_PASS:valid' "$RUNNER_TEMP/sigma607-interpreter.log"
          grep -q 'SIGMA607_BUY_SYNTHETIC_8_CASES_PASS' "$RUNNER_TEMP/sigma607-interpreter.log"
          grep -q 'NOT_SYPC_NODE_CONSENSUS_NOT_A_FULL_SIGNED_TRANSACTION' "$RUNNER_TEMP/sigma607-interpreter.log"
          # Separately verify every named scenario and the six pinned hashes.
          # Mere count/exit-code success is not enough for this security gate.
          python3 ../../tools/review_native6_compilation.py \
            --manifest fingerprints.json \
            --log "$RUNNER_TEMP/native6-compiler.log" \
            --interpreter-log "$RUNNER_TEMP/sigma607-interpreter.log" \
            | tee "$RUNNER_TEMP/sigma607-independent-review.json"
          grep -q '"status": "PASS_PINNED_SIGMA607_COMPILER_AND_SCRIPT_TRACE_ONLY"' "$RUNNER_TEMP/sigma607-independent-review.json"
          echo "SIGMA607_SYNTHETIC_SELL_AND_INDEPENDENT_AUDITOR_PASS; NOT_SYPC_NATIVE_CORE"
      - name: Verify synthetic SIGNED transaction with both Sigma input scripts
        shell: bash
        run: |
          set -euo pipefail
          cd research/native6
          sbt -batch 'runMain org.sypcoin.swap.NativeSigma607SignedTx ../ergo_script/AtomicSellSponsorRefund.sc' \
            2>&1 | tee "$RUNNER_TEMP/sigma607-signed-tx.log"
          grep -q 'SIGMA607_SIGNED_PASS:both_inputs' "$RUNNER_TEMP/sigma607-signed-tx.log"
          grep -q 'SIGMA607_SIGNED_SERIALIZATION_PASS' "$RUNNER_TEMP/sigma607-signed-tx.log"
          grep -q 'SIGMA607_SIGNED_CONSERVATION_PASS' "$RUNNER_TEMP/sigma607-signed-tx.log"
          test "$(grep -c 'SIGMA607_SIGNED_REJECT:' "$RUNNER_TEMP/sigma607-signed-tx.log")" -eq 6
          grep -q 'SIGMA607_SIGNED_SYNTHETIC_7_CASES_PASS' "$RUNNER_TEMP/sigma607-signed-tx.log"
          grep -q 'NOT_SYPC_CORE_CONSENSUS_NOT_MEMPOOL_NOT_MINBOX_NOT_LIVENESS' "$RUNNER_TEMP/sigma607-signed-tx.log"
          echo "SIGMA607_SIGNED_SYNTHETIC_GATE_PASS; NOT_SYPC_CONSENSUS"
