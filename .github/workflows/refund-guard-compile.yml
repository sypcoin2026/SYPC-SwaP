name: Guarded cancellation contracts compilation lab

on:
  push:
    branches:
      - 'work/refund-guard-contract-research-20261112'
    paths:
      - 'research/ergo_script/**'
      - 'research/scala/RefundGuardCompileSpec.scala'
      - 'research/scala/RefundGuardedSignatureSpec.scala'
      - '.github/workflows/refund-guard-compile.yml'

permissions:
  contents: read

jobs:
  guarded-contracts:
    name: Refund guard ErgoTree compile / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - name: Checkout research source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 11
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '11'
      - name: Set up fixed sbt runner
        uses: sbt/setup-sbt@6c68d2fe8dfbc0a0534d70101baa2e0420e1a506 # v1.1.9
        with:
          sbt-runner-version: '1.11.2'
      - name: Checkout original Sigma compiler harness and check source hashes
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/spectrum-finance/ergo-dex.git "$RUNNER_TEMP/spectrum"
          cd "$RUNNER_TEMP/spectrum"
          git checkout --quiet --detach 8fe94e1f8b4e1ab9402fca6fbc3955e3ad1415f7
          test "$(git rev-parse HEAD)" = 8fe94e1f8b4e1ab9402fca6fbc3955e3ad1415f7
          test "$(git hash-object src/test/scala/io/ergodex/core/SigmaPlatform.scala)" = a4b079008592098509cc03bd931a9ef4b5f14518
          mkdir -p research/ergo_script
          cp "$GITHUB_WORKSPACE/research/ergo_script/AtomicBuyRefundGuard.sc" research/ergo_script/
          cp "$GITHUB_WORKSPACE/research/ergo_script/AtomicSellRefundGuard.sc" research/ergo_script/
          cp "$GITHUB_WORKSPACE/research/scala/RefundGuardCompileSpec.scala" src/test/scala/io/ergodex/core/
          cp "$GITHUB_WORKSPACE/research/scala/RefundGuardedSignatureSpec.scala" src/test/scala/io/ergodex/core/
      - name: Compile experimental scripts and bind fee constraints
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spectrum"
          sbt -batch 'testOnly *RefundGuardCompileSpec *RefundGuardedSignatureSpec'
