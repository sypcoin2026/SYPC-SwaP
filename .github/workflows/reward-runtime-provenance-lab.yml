name: Reward runtime fingerprint isolated tests (no JVM)
on:
  pull_request:
    branches:
      - main
    paths:
      - tools/reward_runtime_artifact_fingerprint.py
      - tests/test_reward_runtime_artifact_fingerprint.py
      - .github/workflows/reward-runtime-provenance-lab.yml
      - docs/REWARD_RUNTIME_ARTIFACT_PROVENANCE.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-provenance-tests:
    name: Synthetic /proc checks ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify offline read-only runtime inventory on MOCK proc only
        run: python -m unittest -v tests/test_reward_runtime_artifact_fingerprint.py
