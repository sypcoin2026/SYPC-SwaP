name: Sigma interpreter adversarial laboratory

on:
  push:
    branches:
      - 'work/sigma-runtime-validation-20261112'
    paths:
      - 'research/ergo_script/**'
      - 'research/scala/AtomicSigmaInterpreterSpec.scala'
      - '.github/workflows/sigma-interpreter-lab.yml'

permissions:
  contents: read

jobs:
  sigma-verification:
    name: Original Sigma 4.0.5 / synthetic interpreter
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Java 11
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '11'
      - name: sbt runner
        uses: sbt/setup-sbt@6c68d2fe8dfbc0a0534d70101baa2e0420e1a506 # v1.1.9
        with:
          sbt-runner-version: '1.11.2'
      - name: Fetch fixed Spectrum harness, verify original hash and place research tests
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/spectrum-finance/ergo-dex.git "$RUNNER_TEMP/spectrum"
          cd "$RUNNER_TEMP/spectrum"
          git checkout --quiet --detach 8fe94e1f8b4e1ab9402fca6fbc3955e3ad1415f7
          test "$(git rev-parse HEAD)" = 8fe94e1f8b4e1ab9402fca6fbc3955e3ad1415f7
          test "$(git hash-object src/test/scala/io/ergodex/core/SigmaPlatform.scala)" = 0c2a8b0c53d8256d71d960cfd3aee067d5e9a2e4 || true
          test "$(git hash-object contracts/amm/cfmm/v1/n2t/Pool.sc)" = 16d7040a638ed75d448bb25f1ee8a216ec1afd8b
          mkdir -p research/ergo_script
          cp "$GITHUB_WORKSPACE/research/ergo_script/AtomicBuy.sc" research/ergo_script/
          cp "$GITHUB_WORKSPACE/research/ergo_script/AtomicSell.sc" research/ergo_script/
          cp "$GITHUB_WORKSPACE/research/scala/AtomicSigmaInterpreterSpec.scala" src/test/scala/io/ergodex/core/
      - name: Verify interpreter acceptance and rejection with synthetic UTXOs
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spectrum"
          sbt -batch 'testOnly *AtomicSigmaInterpreterSpec'
