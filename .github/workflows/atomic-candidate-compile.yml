name: Atomic candidate reproducibility laboratory

on:
  push:
    branches:
      - 'work/atomic-determinism-20261112'
    paths:
      - 'research/scala/**'
      - 'research/ergo_script/**'
      - '.github/workflows/atomic-candidate-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-sigma-compile:
    name: Atomic ErgoTree reproducibility / Sigma 4.0.5
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate code without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 11
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '11'
      - name: Setup pinned sbt runner
        uses: sbt/setup-sbt@6c68d2fe8dfbc0a0534d70101baa2e0420e1a506 # v1.1.9
        with:
          sbt-runner-version: '1.11.2'
      - name: Fetch original Spectrum compiler harness at verified commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none https://github.com/spectrum-finance/ergo-dex.git "$RUNNER_TEMP/spectrum"
          cd "$RUNNER_TEMP/spectrum"
          git checkout --quiet --detach 8fe94e1f8b4e1ab9402fca6fbc3955e3ad1415f7
          test "$(git rev-parse HEAD)" = 8fe94e1f8b4e1ab9402fca6fbc3955e3ad1415f7
          test "$(git hash-object contracts/amm/cfmm/v1/n2t/Pool.sc)" = 16d7040a638ed75d448bb25f1ee8a216ec1afd8b
          test "$(git hash-object LICENSE)" = 1625c1793607996fcfc46420e8aa2f3d2b7efd1e
          mkdir -p research/ergo_script
          cp "$GITHUB_WORKSPACE/research/ergo_script/AtomicBuy.sc" research/ergo_script/
          cp "$GITHUB_WORKSPACE/research/ergo_script/AtomicSell.sc" research/ergo_script/
          cp "$GITHUB_WORKSPACE/research/scala/AtomicScriptCompileSpec.scala" src/test/scala/io/ergodex/core/
      - name: Test atomic compiler determinism and parameter binding
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/spectrum"
          sbt -batch 'testOnly *AtomicScriptCompileSpec'
